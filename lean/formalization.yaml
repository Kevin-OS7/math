# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# Catalog of papers with a formalized main result. Paths are relative to lean/.
version: "v0.4"

project:
  name: "Kevin-OS7 math repository"
  description: "Lean formalizations accompanying a mathematics manuscript collection produced by AI models."
  authors: ["Claude Opus 5.5", "GPT-6-Astra", "Claude Fable 5.1"]
  license: "Apache-2.0"

sources:
  - title: "The maximum number of non-equivalent ancestral configurations: a proof of a conjecture of Disanto and Rosenberg"
    authors: ["Claude Opus 5.5", "GPT-6-Astra", "Claude Fable 5.1"]
    id: ../preprints/The-maximum-number-of-non-equivalent-ancestral-configurations-October-29-2026/paper.pdf
    type: article

  - title: "The reversed-prime iteration of OEIS A100475 never enters a cycle"
    authors: ["Claude Opus 5.5"]
    id: ../preprints/The-reversed-prime-iteration-of-OEIS-A100475-never-enters-a-cycle-October-29-2026/paper.pdf
    type: article

  - title: "Maximally probable labeled topologies with simultaneity: a proof of a conjecture of Dickey and Rosenberg"
    authors: ["GPT-6-Astra", "Claude Fable 5.1", "Claude Opus 5.5"]
    id: ../preprints/Maximally-probable-labeled-topologies-with-simultaneity-October-29-2026/paper.pdf
    type: article

  - title: "The minimum and maximum forcing numbers of bipartite graphs: an answer to a question of Liu, Diwan and Zhang"
    authors: ["GPT-6-Astra", "Claude Fable 5.1", "Claude Opus 5.5"]
    id: ../preprints/The-minimum-and-maximum-forcing-numbers-of-bipartite-graphs-October-29-2026/paper.pdf
    type: article

  - title: "Minimum-variance phylogenetic trees are not unique up to depth-equivalence"
    authors: ["GPT-6-Astra", "Claude Fable 5.1", "Claude Opus 5.5"]
    id: ../preprints/Minimum-variance-phylogenetic-trees-are-not-unique-up-to-depth-equivalence-October-29-2026/paper.pdf
    type: article

  - title: "Connected locally equienergetic graphs: counterexamples to a conjecture of Dede and Popat"
    authors: ["GPT-6-Astra", "Claude Fable 5.1", "Claude Opus 5.5"]
    id: ../preprints/Connected-locally-equienergetic-graphs-October-29-2026/paper.pdf
    type: article

  - title: "The two largest coset leaders modulo (q+1)(q^m±1): a proof of two conjectures of Liu, Wu and Zhu"
    authors: ["GPT-6-Astra", "Claude Fable 5.1", "Claude Opus 5.5"]
    id: ../preprints/A-proof-of-two-conjectures-of-Liu-Wu-and-Zhu-on-coset-leaders-October-29-2026/paper.pdf
    type: article

  - title: "The third largest coset leader modulo q^m+1: a counterexample to a conjecture of Liu, Li, Guo and Song"
    authors: ["GPT-6-Astra", "Claude Opus 5.5"]
    id: ../preprints/A-counterexample-to-a-conjecture-of-Liu-Li-Guo-and-Song-on-coset-leaders-October-29-2026/paper.pdf
    type: article

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on

  - id: https://github.com/google-deepmind/formal-conjectures
    relationship: builds-on

status:
  scope: "All main results formalized."
  # Entries use source-qualified declaration names and the files containing them.
  main_results:
    - comparator_config: ComparatorChallenges/AncestralConfigurations.json
      declaration: KOS.AncestralConfigurations.disanto_rosenberg
      file: KOS/Phylogenetics/AncestralConfigurations/Main.lean

    - declaration: KOS.AncestralConfigurations.disanto_rosenberg_unique
      file: KOS/Phylogenetics/AncestralConfigurations/Main.lean

    - declaration: KOS.AncestralConfigurations.disanto_rosenberg_minimum
      file: KOS/Phylogenetics/AncestralConfigurations/Main.lean

    - declaration: KOS.AncestralConfigurations.disanto_rosenberg_paper
      file: KOS/Phylogenetics/AncestralConfigurations/PaperDefinitions.lean

    - declaration: KOS.AncestralConfigurations.disanto_rosenberg_realizations
      file: KOS/Phylogenetics/AncestralConfigurations/PaperDefinitions.lean

    - declaration: KOS.AncestralConfigurationsIndependent.disanto_rosenberg
      file: KOS/Phylogenetics/AncestralConfigurations/Independent.lean

    - comparator_config: ComparatorChallenges/OEISA100475.json
      declaration: OeisA100475.not_conjecture
      file: KOS/NumberTheory/OEIS/A100475.lean

    - comparator_config: ComparatorChallenges/DickeyRosenberg.json
      declaration: DickeyRosenberg.conjecture14i
      file: KOS/Phylogenetics/LabeledHistories/Main.lean

    - comparator_config: ComparatorChallenges/DickeyRosenberg.json
      declaration: DickeyRosenberg.conjecture14ii
      file: KOS/Phylogenetics/LabeledHistories/Main.lean

    - declaration: DickeyRosenberg.conjecture14i_paper
      file: KOS/Phylogenetics/LabeledHistories/Main.lean

    - declaration: DickeyRosenberg.conjecture14ii_paper
      file: KOS/Phylogenetics/LabeledHistories/Main.lean

    - comparator_config: ComparatorChallenges/ForcingNumbers.json
      declaration: Forcing.problem55
      file: KOS/GraphTheory/ForcingNumbers/Main.lean

    - comparator_config: ComparatorChallenges/DepthVariance.json
      declaration: DepthVariance.minimum_variance_depth_unique_false
      file: KOS/Phylogenetics/DepthVariance/Main.lean

    - declaration: DepthVariance.explicit_counterexample
      file: KOS/Phylogenetics/DepthVariance/Main.lean

    - comparator_config: ComparatorChallenges/LocalEnergy.json
      declaration: DedePopat.not_conjecture1
      file: KOS/ChemicalGraphTheory/LocalEnergy/Main.lean

    - declaration: DedePopat.not_conjecture1NonEquienergetic
      file: KOS/ChemicalGraphTheory/LocalEnergy/Main.lean

    - declaration: DedePopat.not_corollary2
      file: KOS/ChemicalGraphTheory/LocalEnergy/Main.lean

    - comparator_config: ComparatorChallenges/TwoLargestCosetLeaders.json
      declaration: CosetA.conjecturesA
      file: KOS/CodingTheory/TwoLargestCosetLeaders/Main.lean

    - comparator_config: ComparatorChallenges/ThirdLargestCosetLeader.json
      declaration: CosetB.conjecture25_false
      file: KOS/CodingTheory/ThirdLargestCosetLeader/Main.lean

    - declaration: CosetB.counterexample_q4_m12
      file: KOS/CodingTheory/ThirdLargestCosetLeader/Main.lean

automation:
  methods:
    - method: agent

review:
  status: unchecked

acknowledgements: >-
  Thank you very much to the authors of Lean 4, Mathlib, google-deepmind/formal-conjectures,
  Lake, Comparator, lean4export, landrun and nanoda, and to the authors who posed the questions:
  Disanto, Dickey and Rosenberg; the OEIS contributors; Liu, Diwan and Zhang;
  Coronado, Mir, Rosselló and Rotger; Dede and Popat; Liu, Wu and Zhu; and Liu, Li, Guo and Song.
